<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vacation Planner</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #f5f7fb;
  color: #1f2937;
}

header {
  background: #2563eb;
  color: white;
  padding: 30px 20px;
  border-radius: 0 0 24px 24px;
}

header h1 {
  margin: 0 0 6px;
  font-size: 30px;
}

header p {
  margin: 0;
  opacity: .9;
}

.container {
  max-width: 700px;
  margin: auto;
  padding: 20px;
}

.card {
  background: white;
  border-radius: 18px;
  padding: 20px;
  margin-bottom: 18px;
  box-shadow: 0 3px 12px rgba(0,0,0,.07);
}

h2 {
  margin-top: 0;
}

input {
  width: 100%;
  padding: 14px;
  margin: 7px 0 15px;
  border: 1px solid #d1d5db;
  border-radius: 12px;
  font-size: 16px;
}

button {
  border: 0;
  border-radius: 14px;
  padding: 14px 18px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
}

.primary {
  width: 100%;
  background: #2563eb;
  color: white;
}

.trip {
  border: 1px solid #e5e7eb;
  border-radius: 15px;
  padding: 16px;
  margin-bottom: 12px;
}

.trip-title {
  font-size: 21px;
  font-weight: 700;
}

.empty {
  color: #6b7280;
  text-align: center;
  padding: 15px;
}
</style>
</head>

<body>

<header>
  <h1>✈️ Vacation Planner</h1>
  <p>Plan your next adventure</p>
</header>

<div class="container">

  <div class="card">
    <h2>🌎 My Trips</h2>

    <div id="tripList">
      <div class="empty">
        No trips yet. Create your first vacation!
      </div>
    </div>

    <button class="primary" onclick="showNewTrip()">
      ➕ Create New Trip
    </button>
  </div>

  <div class="card" id="newTripCard" style="display:none;">

    <h2>🗺️ Create New Trip</h2>

    <label>Destination</label>
    <input id="destination" placeholder="Example: San Francisco">

    <label>Start date</label>
    <input id="startDate" type="date">

    <label>End date</label>
    <input id="endDate" type="date">

    <label>Number of travelers</label>
    <input id="travelers" type="number" min="1" value="4">

    <button class="primary" onclick="createTrip()">
      Create Trip
    </button>

  </div>

</div>

<script>

let trips =
  JSON.parse(localStorage.getItem("vacationTrips")) || [];

function showNewTrip() {
  document.getElementById("newTripCard").style.display = "block";
  document.getElementById("destination").focus();
}

function createTrip() {

  const destination =
    document.getElementById("destination").value.trim();

  const startDate =
    document.getElementById("startDate").value;

  const endDate =
    document.getElementById("endDate").value;

  const travelers =
    document.getElementById("travelers").value;

  if (!destination || !startDate || !endDate) {
    alert("Please enter your destination and dates.");
    return;
  }

  const trip = {
    id: Date.now(),
    destination: destination,
    startDate: startDate,
    endDate: endDate,
    travelers: travelers,
    activities: [],
    budget: 0
  };

  trips.push(trip);

  localStorage.setItem(
    "vacationTrips",
    JSON.stringify(trips)
  );

  document.getElementById("newTripCard").style.display = "none";

  displayTrips();
}

function displayTrips() {

  const list = document.getElementById("tripList");

  if (trips.length === 0) {
    list.innerHTML =
      '<div class="empty">No trips yet. Create your first vacation!</div>';
    return;
  }

  list.innerHTML = "";

  trips.forEach(trip => {

    const div = document.createElement("div");

    div.className = "trip";
    div.onclick = function() {
  openTrip(trip);
};

    div.innerHTML = `
      <div class="trip-title">
        🌴 ${trip.destination}
      </div>

      <p>
        📅 ${formatDate(trip.startDate)}
        – ${formatDate(trip.endDate)}
      </p>

      <p>
        👨‍👩‍👧‍👦 ${trip.travelers} traveler(s)
      </p>
    `;

    list.appendChild(div);

  });
}

function openTrip(trip) {
  document.body.innerHTML = `
    <header>
      <h1>✈️ ${trip.destination}</h1>
      <p>${formatDate(trip.startDate)} – ${formatDate(trip.endDate)}</p>
    </header>

    <div class="container">

      <div class="card">
        <h2>👨‍👩‍👧‍👦 Trip Details</h2>
        <p>${trip.travelers} travelers</p>
      </div>

      <div class="card">
        <h2>🗓️ Itinerary</h2>
        <button class="primary" onclick="alert('Itinerary coming next!')">
          Add Itinerary
        </button>
      </div>

      <div class="card">
        <h2>📍 Places & Map</h2>
        <button class="primary" onclick="alert('Map coming next!')">
          Add Places
        </button>
      </div>

      <div class="card">
        <h2>🍽️ Restaurants</h2>
        <button class="primary" onclick="alert('Restaurants coming next!')">
          Add Restaurants
        </button>
      </div>

      <div class="card">
        <h2>🎟️ Activities</h2>
        <button class="primary" onclick="alert('Activities coming next!')">
          Add Activities
        </button>
      </div>

      <div class="card">
        <h2>💰 Budget</h2>
        <button class="primary" onclick="alert('Budget coming next!')">
          Add Expense
        </button>
      </div>

      <div class="card">
        <h2>🧳 Packing List</h2>
        <button class="primary" onclick="alert('Packing list coming next!')">
          Add Item
        </button>
      </div>

    </div>
  `;
}
  function formatDate(date) {

  if (!date) return "";

  const parts = date.split("-");

  return `${parts[1]}/${parts[2]}/${parts[0]}`;
}

displayTrips();

</script>

</body>
</html>
