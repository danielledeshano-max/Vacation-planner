<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vacation Planner</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #f5f7fb;
  color: #1f2937;
}

header {
  background: #2563eb;
  color: white;
  padding: 30px 20px;
  border-radius: 0 0 24px 24px;
}

header h1 {
  margin: 0 0 6px;
  font-size: 30px;
}

header p {
  margin: 0;
  opacity: .9;
}

.container {
  max-width: 700px;
  margin: auto;
  padding: 20px;
}

.card {
  background: white;
  border-radius: 18px;
  padding: 20px;
  margin-bottom: 18px;
  box-shadow: 0 3px 12px rgba(0,0,0,.07);
}

h2 {
  margin-top: 0;
}

input {
  width: 100%;
  padding: 14px;
  margin: 7px 0 15px;
  border: 1px solid #d1d5db;
  border-radius: 12px;
  font-size: 16px;
}

button {
  border: 0;
  border-radius: 14px;
  padding: 14px 18px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
}

.primary {
  width: 100%;
  background: #2563eb;
  color: white;
}

.trip {
  border: 1px solid #e5e7eb;
  border-radius: 15px;
  padding: 16px;
  margin-bottom: 12px;
}

.trip-title {
  font-size: 21px;
  font-weight: 700;
}

.empty {
  color: #6b7280;
  text-align: center;
  padding: 15px;
}
</style>
</head>

<body>

<header>
  <h1>✈️ Vacation Planner</h1>
  <p>Plan your next adventure</p>
</header>

<div class="container">

  <div class="card">
    <h2>🌎 My Trips</h2>

    <div id="tripList">
      <div class="empty">
        No trips yet. Create your first vacation!
      </div>
    </div>

    <button class="primary" onclick="showNewTrip()">
      ➕ Create New Trip
    </button>
  </div>

  <div class="card" id="newTripCard" style="display:none;">

    <h2>🗺️ Create New Trip</h2>

    <label>Destination</label>
    <input id="destination" placeholder="Example: San Francisco">

    <label>Start date</label>
    <input id="startDate" type="date">

    <label>End date</label>
    <input id="endDate" type="date">

    <label>Number of travelers</label>
    <input id="travelers" type="number" min="1" value="4">

    <button class="primary" onclick="createTrip()">
      Create Trip
    </button>

  </div>

</div>

<script>

let trips =
  JSON.parse(localStorage.getItem("vacationTrips")) || [];

function showNewTrip() {
  document.getElementById("newTripCard").style.display = "block";
  document.getElementById("destination").focus();
}

function createTrip() {

  const destination =
    document.getElementById("destination").value.trim();

  const startDate =
    document.getElementById("startDate").value;

  const endDate =
    document.getElementById("endDate").value;

  const travelers =
    document.getElementById("travelers").value;

  if (!destination || !startDate || !endDate) {
    alert("Please enter your destination and dates.");
    return;
  }

  const trip = {
    id: Date.now(),
    destination: destination,
    startDate: startDate,
    endDate: endDate,
    travelers: travelers,
    activities: [],
    budget: 0
  };

  trips.push(trip);

  localStorage.setItem(
    "vacationTrips",
    JSON.stringify(trips)
  );

  document.getElementById("newTripCard").style.display = "none";

  displayTrips();
}

function displayTrips() {
  const tripsList = document.getElementById("tripList");

  if (trips.length === 0) {
    tripsList.innerHTML =
      '<p class="empty">No trips yet. Create your first vacation!</p>';
    return;
  }

  tripsList.innerHTML = "";

  trips.forEach(trip => {
    const start = new Date(trip.startDate + "T12:00:00");
const end = new Date(trip.endDate + "T12:00:00");
const today = new Date();
today.setHours(12, 0, 0, 0);

const daysUntil = Math.ceil(
  (start - today) / (1000 * 60 * 60 * 24)
);

let countdown;

if (today > end) {
  countdown = "📸 Trip completed";
} else if (today >= start) {
  countdown = "🎉 You're on vacation!";
} else if (daysUntil === 1) {
  countdown = "✈️ 1 day to go!";
} else {
  countdown = "✈️ " + daysUntil + " days to go!";
}
    const div = document.createElement("div");
    div.className = "trip";

    div.innerHTML = `
      <div class="trip-title">
        ✈️ ${trip.destination}
      </div>

      <p>
        📅 ${formatDate(trip.startDate)} – ${formatDate(trip.endDate)}
      </p>

      <p>
        👥 ${trip.travelers} travelers
      </p>
<p style="font-weight:bold;">
  ${countdown}
</p>
      <button
        class="primary"
        onclick="openTripById(${trip.id})">
        Open Trip
      </button>
      <button onclick="editTrip(${trip.id})">
  ✏️ Edit Trip
</button>

<button onclick="deleteTrip(${trip.id})">
  🗑️ Delete Trip
</button>
    `;

    tripsList.appendChild(div);
  });
}

function openTripById(tripId) {
  const trip = trips.find(t => t.id === tripId);
  if (trip) {
    openTrip(trip);
  }
}


function deleteTrip(tripId) {
  const trip = trips.find(t => t.id === tripId);

  if (!confirm("Delete " + trip.destination + "?")) {
    return;
  }

  trips = trips.filter(t => t.id !== tripId);

  localStorage.setItem(
    "vacationTrips",
    JSON.stringify(trips)
  );

  displayTrips();
}


function editTrip(tripId) {
  const trip = trips.find(t => t.id === tripId);

  document.body.innerHTML = `
    <header>
      <h1>✏️ Edit Trip</h1>
      <p>${trip.destination}</p>
    </header>

    <div class="container">
      <div class="card">

        <label>Destination</label>
        <input
          id="editTripDestination"
          value="${trip.destination}"
        >

        <label>Start Date</label>
        <input
          id="editTripStart"
          type="date"
          value="${trip.startDate}"
        >

        <label>End Date</label>
        <input
          id="editTripEnd"
          type="date"
          value="${trip.endDate}"
        >

        <label>Travelers</label>
        <input
          id="editTripTravelers"
          type="number"
          min="1"
          value="${trip.travelers}"
        >

        <button
          class="primary"
          onclick="saveEditedTrip(${trip.id})">
          Save Changes
        </button>

      </div>
    </div>
  `;
}


function saveEditedTrip(tripId) {
  const trip = trips.find(t => t.id === tripId);

  const destination =
    document.getElementById("editTripDestination").value.trim();

  const startDate =
    document.getElementById("editTripStart").value;

  const endDate =
    document.getElementById("editTripEnd").value;

  const travelers =
    document.getElementById("editTripTravelers").value;

  if (!destination || !startDate || !endDate || !travelers) {
    alert("Please complete all trip information.");
    return;
  }

  if (endDate < startDate) {
    alert("Your end date must be after your start date.");
    return;
  }

  trip.destination = destination;
  trip.startDate = startDate;
  trip.endDate = endDate;
  trip.travelers = travelers;

  localStorage.setItem(
    "vacationTrips",
    JSON.stringify(trips)
  );

  location.reload();
}
function openTrip(trip) {
  document.body.innerHTML = `
    <header>
      <h1>✈️ ${trip.destination}</h1>
      <p>${formatDate(trip.startDate)} – ${formatDate(trip.endDate)}</p>
    </header>

    <div class="container">

      <div class="card">
        <h2>👨‍👩‍👧‍👦 Trip Details</h2>
        <p>${trip.travelers} travelers</p>
      </div>

      <div class="card">
        <h2>🗓️ Itinerary</h2>
        <button class="primary"
  onclick="openItinerary(trips.find(t => t.id === ${trip.id}))">
  Add Itinerary
</button>
      </div>

      <div class="card">
  <h2>📍 Places & Map</h2>
  <button class="primary"
    onclick="openPlaces(trips.find(t => t.id === ${trip.id}))">
    Add Places
  </button>
</div>

      <div class="card">
  <h2>🍽️ Restaurants</h2>
  <button class="primary"
    onclick="openRestaurants(trips.find(t => t.id === ${trip.id}))">
    Add Restaurants
  </button>
</div>

      <div class="card">
  <h2>🎟️ Activities</h2>
  <button class="primary"
    onclick="openActivities(trips.find(t => t.id === ${trip.id}))">
    Add Activities
  </button>
</div>
      <div class="card">
  <h2>✈️ Transportation</h2>
  <button class="primary"
    onclick="openTransportation(trips.find(t => t.id === ${trip.id}))">
    Transportation Details
  </button>
</div>
<div class="card">
  <h2>🎫 Reservations & Tickets</h2>
  <button class="primary"
    onclick="openReservations(trips.find(t => t.id === ${trip.id}))">
    Reservations & Tickets
  </button>
</div>
      <div class="card">
  <h2>🏨 Hotel</h2>
  <button class="primary"
    onclick="openHotel(trips.find(t => t.id === ${trip.id}))">
    Hotel Details
  </button>
</div>

      <div class="card">
  <h2>💰 Budget</h2>
  <button class="primary"
    onclick="openBudget(trips.find(t => t.id === ${trip.id}))">
    Add Expense
  </button>
</div>

      <div class="card">
  <h2>🧳 Packing List</h2>
  <button class="primary"
    onclick="openPackingList(trips.find(t => t.id === ${trip.id}))">
    Open Packing List
  </button>
</div>

    </div>
  `;
}
function openItinerary(trip) {

  const activities = [
  ...(trip.activities || []).map((item, index) => ({
    ...item,
    source: "itinerary",
    sourceIndex: index,
    icon: "📌"
  })),

  ...(trip.tripActivities || []).map(item => ({
    name: item.name,
    date: item.date,
    time: item.time,
    note: item.note,
    icon: "🎯",
    source: "activity"
  })),

  ...(trip.reservations || []).map(item => ({
    name: item.name,
    date: item.date,
    time: item.time,
    note: item.note,
    icon: "🎫",
    source: "reservation"
  })),

  ...(trip.restaurants || [])
    .filter(item => item.date)
    .map(item => ({
      name: item.name,
      date: item.date,
      time: item.time,
      note: item.note,
      icon: "🍽️",
      source: "restaurant"
    })),

  ...(trip.transportation || []).map(item => ({
    name: `${item.type} ${item.company || ""}`.trim(),
    date: item.date,
    time: item.departureTime,
    note: item.from && item.to
      ? `${item.from} → ${item.to}`
      : item.note,
    icon: "✈️",
    source: "transportation"
  }))
];

activities.sort((a, b) =>
  ((a.date || "") + (a.time || ""))
    .localeCompare((b.date || "") + (b.time || ""))
);
  document.body.innerHTML = `
    <header>
      <button
        onclick="openTrip(trips.find(t => t.id === ${trip.id}))"
        style="background:rgba(255,255,255,.2); color:white; margin-bottom:15px;">
        ← Back
      </button>

      <h1>🗓️ ${trip.destination} Itinerary</h1>
      <p>${formatDate(trip.startDate)} – ${formatDate(trip.endDate)}</p>
    </header>

    <div class="container">

      <div class="card">
        <h2>📅 Day-by-Day Plans</h2>

        <div id="itineraryList">

          ${activities.length > 0
            ? activities.map((item, index) => `
    <div class="trip">

      <div class="trip-title">
        ${item.icon || "📌"} ${prettyDate(item.date)}
      </div>

      <p>
        🕐 ${prettyTime(item.time)}
      </p>

      <p>
        <strong>${item.plan || item.name || ""}</strong>
      </p>

      ${item.note
        ? `<p>📝 ${item.note}</p>`
        : ""
      }

      ${item.source === "itinerary" ? `
        <button
          onclick="editItineraryItem(${trip.id}, ${item.sourceIndex})">
          ✏️ Edit
        </button>

        <button
          onclick="deleteItineraryItem(${trip.id}, ${item.sourceIndex})">
          🗑️ Delete
        </button>
      ` : ""}

    </div>

            `).join("")
            : '<p class="empty">No plans added yet.</p>'
          }

        </div>

        <button
          class="primary"
          onclick="addItineraryItem(${trip.id})">
          ➕ Add a Plan
        </button>

      </div>

    </div>
  `;
}
function prettyDate(date) {
  if (!date) return "Date not set";

  const d = new Date(date + "T12:00:00");

  return d.toLocaleDateString("en-US", {
    weekday: "long",
    month: "short",
    day: "numeric"
  });
}

function prettyTime(time) {
  if (!time) return "No time set";

  const parts = time.split(":");
  let hour = Number(parts[0]);
  const minutes = parts[1];

  const ampm = hour >= 12 ? "PM" : "AM";

  hour = hour % 12;
  hour = hour || 12;

  return hour + ":" + minutes + " " + ampm;
}

function deleteItineraryItem(tripId, index) {
  const trip = trips.find(t => t.id === tripId);

  if (!confirm("Delete this plan?")) return;

  trip.activities.splice(index, 1);

  localStorage.setItem(
    "vacationTrips",
    JSON.stringify(trips)
  );

  openItinerary(trip);
}

function editItineraryItem(tripId, index) {
  const trip = trips.find(t => t.id === tripId);
  const item = trip.activities[index];

  document.body.innerHTML = `
    <header>
      <h1>✏️ Edit Plan</h1>
      <p>${trip.destination}</p>
    </header>

    <div class="container">
      <div class="card">

        <label>Date</label>
        <input
          id="editDate"
          type="date"
          min="${trip.startDate}"
          max="${trip.endDate}"
          value="${item.date || ""}"
        >

        <label>Time</label>
        <input
          id="editTime"
          type="time"
          value="${item.time || ""}"
        >

        <label>What are you doing?</label>
        <input
          id="editPlan"
          value="${item.plan || ""}"
        >

        <button
          class="primary"
          onclick="saveEditedItineraryItem(${trip.id}, ${index})">
          Save Changes
        </button>

      </div>
    </div>
  `;
}

function saveEditedItineraryItem(tripId, index) {
  const trip = trips.find(t => t.id === tripId);

  const date =
    document.getElementById("editDate").value;

  const time =
    document.getElementById("editTime").value;

  const plan =
    document.getElementById("editPlan").value.trim();

  if (!date || !time || !plan) {
    alert("Please choose a date, time, and activity.");
    return;
  }

  trip.activities[index] = {
    date: date,
    time: time,
    plan: plan
  };

  trip.activities.sort((a, b) =>
    (a.date + a.time).localeCompare(b.date + b.time)
  );

  localStorage.setItem(
    "vacationTrips",
    JSON.stringify(trips)
  );

  openItinerary(trip);
}
  function addItineraryItem(tripId) {
  const trip = trips.find(t => t.id === tripId);

  document.body.innerHTML = `
    <header>
      <h1>➕ Add a Plan</h1>
      <p>${trip.destination}</p>
    </header>

    <div class="container">
      <div class="card">

        <label>Date</label>
        <input
          id="planDate"
          type="date"
          min="${trip.startDate}"
          max="${trip.endDate}"
        >

        <label>Time</label>
        <input id="planTime" type="time">

        <label>What are you doing?</label>
        <input
          id="planName"
          placeholder="Example: Oakland Zoo"
        >

        <button class="primary"
          onclick="saveItineraryItem(${trip.id})">
          Save Plan
        </button>

      </div>
    </div>
  `;
}

function saveItineraryItem(tripId) {
  const trip = trips.find(t => t.id === tripId);

  const date = document.getElementById("planDate").value;
  const time = document.getElementById("planTime").value;
  const plan = document.getElementById("planName").value.trim();

  if (!date || !time || !plan) {
    alert("Please choose a date, time, and activity.");
    return;
  }

  trip.activities.push({
    date: date,
    time: time,
    plan: plan
  });

  trip.activities.sort((a, b) =>
    (a.date + a.time).localeCompare(b.date + b.time)
  );

  localStorage.setItem(
    "vacationTrips",
    JSON.stringify(trips)
  );

  openItinerary(trip);
}
function openPlaces(trip) {
  if (!trip.places) trip.places = [];

  document.body.innerHTML = `
    <header>
      <button
        onclick="openTrip(trips.find(t => t.id === ${trip.id}))"
        style="background:rgba(255,255,255,.2);color:white;margin-bottom:15px;">
        ← Back
      </button>

      <h1>📍 Places & Map</h1>
      <p>${trip.destination}</p>
    </header>

    <div class="container">

      <div class="card">
        <h2>Saved Places</h2>

        ${trip.places.length
          ? trip.places.map((place, index) => `
              <div class="trip">
                <div class="trip-title">${place.name}</div>
                <p>📍 ${place.address}</p>

                ${place.note
                  ? `<p>📝 ${place.note}</p>`
                  : ""
                }

                <button onclick="openPlaceInMaps('${encodeURIComponent(place.address)}')">
                  🗺️ Open in Maps
                </button>

                <button onclick="deletePlace(${trip.id}, ${index})">
                  🗑️ Delete
                </button>
              </div>
            `).join("")
          : '<p class="empty">No places saved yet.</p>'
        }

        <button
          class="primary"
          onclick="addPlace(${trip.id})">
          ➕ Add a Place
        </button>
      </div>

    </div>
  `;
}

function addPlace(tripId) {
  const trip = trips.find(t => t.id === tripId);

  document.body.innerHTML = `
    <header>
      <h1>📍 Add a Place</h1>
      <p>${trip.destination}</p>
    </header>

    <div class="container">
      <div class="card">

        <label>Place name</label>
        <input id="placeName"
          placeholder="Example: Oakland Zoo">

        <label>Address</label>
        <input id="placeAddress"
          placeholder="Example: 9777 Golf Links Rd, Oakland, CA">

        <label>Notes</label>
        <input id="placeNote"
          placeholder="Example: Arrive before 10 AM">

        <button
          class="primary"
          onclick="savePlace(${trip.id})">
          Save Place
        </button>

      </div>
    </div>
  `;
}

function savePlace(tripId) {
  const trip = trips.find(t => t.id === tripId);

  const name =
    document.getElementById("placeName").value.trim();

  const address =
    document.getElementById("placeAddress").value.trim();

  const note =
    document.getElementById("placeNote").value.trim();

  if (!name || !address) {
    alert("Please enter a place name and address.");
    return;
  }

  if (!trip.places) trip.places = [];

  trip.places.push({
    name: name,
    address: address,
    note: note
  });

  localStorage.setItem(
    "vacationTrips",
    JSON.stringify(trips)
  );

  openPlaces(trip);
}

function deletePlace(tripId, index) {
  const trip = trips.find(t => t.id === tripId);

  if (!confirm("Delete this place?")) return;

  trip.places.splice(index, 1);

  localStorage.setItem(
    "vacationTrips",
    JSON.stringify(trips)
  );

  openPlaces(trip);
}

function openPlaceInMaps(address) {
  window.open(
    "https://maps.apple.com/?q=" + address,
    "_blank"
  );
}
function openRestaurants(trip) {
  if (!trip.restaurants) trip.restaurants = [];

  document.body.innerHTML = `
    <header>
      <button
        onclick="openTrip(trips.find(t => t.id === ${trip.id}))"
        style="background:rgba(255,255,255,.2);color:white;margin-bottom:15px;">
        ← Back
      </button>

      <h1>🍽️ Restaurants</h1>
      <p>${trip.destination}</p>
    </header>

    <div class="container">
      <div class="card">
        <h2>Saved Restaurants</h2>

        ${trip.restaurants.length
          ? trip.restaurants.map((restaurant, index) => `
              <div class="trip">
                <div class="trip-title">
                  🍴 ${restaurant.name}
                </div>

                <p>📍 ${restaurant.address}</p>

                ${restaurant.date
                  ? `<p>📅 ${prettyDate(restaurant.date)}</p>`
                  : ""
                }

                ${restaurant.time
                  ? `<p>🕐 ${prettyTime(restaurant.time)}</p>`
                  : ""
                }

                ${restaurant.note
                  ? `<p>📝 ${restaurant.note}</p>`
                  : ""
                }

                <button
                  onclick="openPlaceInMaps('${encodeURIComponent(restaurant.address)}')">
                  🗺️ Open in Maps
                </button>

                <button
                  onclick="deleteRestaurant(${trip.id}, ${index})">
                  🗑️ Delete
                </button>
              </div>
            `).join("")
          : '<p class="empty">No restaurants saved yet.</p>'
        }

        <button
          class="primary"
          onclick="addRestaurant(${trip.id})">
          ➕ Add Restaurant
        </button>
      </div>
    </div>
  `;
}

function addRestaurant(tripId) {
  const trip = trips.find(t => t.id === tripId);

  document.body.innerHTML = `
    <header>
      <h1>🍽️ Add Restaurant</h1>
      <p>${trip.destination}</p>
    </header>

    <div class="container">
      <div class="card">

        <label>Restaurant name</label>
        <input id="restaurantName"
          placeholder="Example: Pier Market">

        <label>Address</label>
        <input id="restaurantAddress"
          placeholder="Restaurant address">

        <label>Reservation date</label>
        <input
          id="restaurantDate"
          type="date"
          min="${trip.startDate}"
          max="${trip.endDate}"
        >

        <label>Reservation time</label>
        <input id="restaurantTime" type="time">

        <label>Notes</label>
        <input id="restaurantNote"
          placeholder="Example: Dinner reservation">

        <button
          class="primary"
          onclick="saveRestaurant(${trip.id})">
          Save Restaurant
        </button>

      </div>
    </div>
  `;
}

function saveRestaurant(tripId) {
  const trip = trips.find(t => t.id === tripId);

  const name =
    document.getElementById("restaurantName").value.trim();

  const address =

  parseFloat(trip.hotel?.cost) || 0;

  (trip.transportation || [])

  document.body.innerHTML = `

                  💵 $${Number(expense.amount).toFixed(2)}
                </p>

                <button
                  onclick="deleteExpense(${trip.id}, ${index})">
                  🗑️ Delete
                </button>
              </div>
            `).join("")

        ${hotelTotal > 0 ? `
  <div class="card">
    <h2>🏨 Hotel Cost</h2>
    ${transportationTotal > 0 ? `
  <div class="card">
    <h2>✈️ Transportation Costs</h2>

    <p>

        Transportation Total:

      </strong>
    </p>

` : ""}
${reservationTotal > 0 ? `

                  ? `<p>📅 ${prettyDate(item.date)}</p>`
                  : ""
                }

                ${item.departureTime
                  ? `<p>🕐 Departure: ${prettyTime(item.departureTime)}</p>`
                  : ""
                }

                ${item.from
                  ? `<p>📍 From: ${item.from}</p>`
                  : ""
                }

                ${item.arrivalTime
                  ? `<p>🕐 Arrival: ${prettyTime(item.arrivalTime)}</p>`
                  : ""
                }

                ${item.to
                  ? `<p>📍 To: ${item.to}</p>`
                  : ""
                }

                ${item.confirmation
                  ? `<p>🔑 Confirmation: ${item.confirmation}</p>`
                  : ""
                }

                ${item.cost
                  ? `<p>💵 $${Number(item.cost).toFixed(2)}</p>`
                  : ""
                }

                ${item.note
                  ? `<p>📝 ${item.note}</p>`
                  : ""
                }

                <button
                  onclick="deleteTransportation(${trip.id}, ${index})">
                  🗑️ Delete
                </button>

              </div>
            `).join("")
          : '<p class="empty">No transportation added yet.</p>'
        }

        <button
          class="primary"
          onclick="addTransportation(${trip.id})">

        </button>

      </div>
    </div>
  `;
}


function addTransportation(tripId) {
  const trip = trips.find(t => t.id === tripId);

  document.body.innerHTML = `
    <header>
      <h1>✈️ Add Transportation</h1>
      <p>${trip.destination}</p>
    </header>

    <div class="container">
      <div class="card">

        <label>Transportation type</label>
        <select
          id="transportType"
          style="width:100%;padding:14px;margin:7px 0 15px;border:1px solid #d1d5db;border-radius:12px;font-size:16px;">
          <option>✈️ Flight</option>
          <option>🚆 Train</option>
          <option>🚗 Rental Car</option>
          <option>🚌 Bus</option>
          <option>⛴️ Ferry</option>
          <option>🚕 Taxi / Rideshare</option>
          <option>🚙 Other</option>
        </select>

        <label>Airline / Company</label>
        <input
          id="transportCompany"
          placeholder="Example: Delta or Amtrak"
        >

        <label>Flight / Train / Reservation number</label>
        <input
          id="transportNumber"
          placeholder="Example: DL1234"
        >

        <label>Date</label>
        <input
          id="transportDate"
          type="date"
          min="${trip.startDate}"
          max="${trip.endDate}"
        >

        <label>Departure time</label>
        <input
          id="transportDepartureTime"
          type="time"
        >

        <label>Leaving from</label>
        <input
          id="transportFrom"
          placeholder="Example: Detroit Metro Airport"
        >

        <label>Arrival time</label>
        <input
          id="transportArrivalTime"
          type="time"
        >

        <label>Going to</label>
        <input
          id="transportTo"
          placeholder="Example: San Francisco Airport"
        >

        <label>Confirmation number</label>
        <input
          id="transportConfirmation"
          placeholder="Optional"
        >

        <label>Total cost</label>
        <input
          id="transportCost"
          type="number"
          min="0"
          step="0.01"
          placeholder="0.00"
        >

        <label>Notes</label>
        <input
          id="transportNote"
          placeholder="Seats, baggage, parking, etc."
        >

        <button
          class="primary"
          onclick="saveTransportation(${trip.id})">
          Save Transportation
        </button>

      </div>
    </div>
  `;
}


function saveTransportation(tripId) {
  const trip = trips.find(t => t.id === tripId);

  const type =
    document.getElementById("transportType").value;

  const company =
    document.getElementById("transportCompany").value.trim();

  const number =
    document.getElementById("transportNumber").value.trim();

  const date =
    document.getElementById("transportDate").value;

  const departureTime =
    document.getElementById("transportDepartureTime").value;

  const from =
    document.getElementById("transportFrom").value.trim();

  const arrivalTime =
    document.getElementById("transportArrivalTime").value;

  const to =
    document.getElementById("transportTo").value.trim();

  const confirmation =
    document.getElementById("transportConfirmation").value.trim();

  const cost =
    document.getElementById("transportCost").value;

  const note =
    document.getElementById("transportNote").value.trim();

  if (!date) {
    alert("Please choose a date.");
    return;
  }

  if (!trip.transportation) {
    trip.transportation = [];
  }

  trip.transportation.push({
    type,
    company,
    number,
    date,
    departureTime,
    from,
    arrivalTime,
    to,
    confirmation,
    cost,
    note
  });

  trip.transportation.sort((a, b) =>
    ((a.date || "") + (a.departureTime || ""))
      .localeCompare(
        (b.date || "") + (b.departureTime || "")
      )
  );

  localStorage.setItem(
    "vacationTrips",
    JSON.stringify(trips)
  );

  openTransportation(trip);
}


function deleteTransportation(tripId, index) {
  const trip = trips.find(t => t.id === tripId);

  if (!confirm("Delete this transportation?")) return;

  trip.transportation.splice(index, 1);

  localStorage.setItem(
    "vacationTrips",
    JSON.stringify(trips)
  );

  openTransportation(trip);
}
function openReservations(trip) {
  if (!trip.reservations) trip.reservations = [];

  document.body.innerHTML = `
    <header>

function saveReservation(tripId) {
  const trip = trips.find(t => t.id === tripId);

  const name =

  const date =

  const time =

  const confirmation =
    document.getElementById("reservationConfirmation").value.trim();

  const cost =
    document.getElementById("reservationCost").value;

  const note =
    document.getElementById("reservationNote").value.trim();

  if (!name) {

  if (!trip.reservations) {

  trip.reservations.push({

  });

function editReservation(tripId, index) {
  const trip = trips.find(t => t.id === tripId);
  const item = trip.reservations[index];

  document.body.innerHTML = `
    <header>
      <h1>✏️ Edit Reservation</h1>
      <p>${trip.destination}</p>
    </header>

    <div class="container">
      <div class="card">

        <label>Reservation / Ticket name</label>
        <input
          id="reservationName"
          value="${item.name || ""}"
        >

        <label>Date</label>
        <input
          id="reservationDate"
          type="date"
          min="${trip.startDate}"
          max="${trip.endDate}"

        >

        <label>Time</label>
        <input
          id="reservationTime"
          type="time"
          value="${item.time || ""}"
        >

        <label>Confirmation number</label>
        <input
          id="reservationConfirmation"
          value="${item.confirmation || ""}"
        >

        <label>Total cost</label>
        <input
          id="reservationCost"
          type="number"
          min="0"
          step="0.01"
          value="${item.cost || ""}"
        >

        <label>Notes</label>
        <input
          id="reservationNote"
          value="${item.note || ""}"
        >

        </button>

    </div>
  `;
}


function saveEditedReservation(tripId, index) {
  const trip = trips.find(t => t.id === tripId);

  const name =
    document.getElementById("reservationName").value.trim();

  if (!name) {
    alert("Please enter a reservation or ticket name.");
    return;
  }

  trip.reservations[index] = {
    name,
    date: document.getElementById("reservationDate").value,
    time: document.getElementById("reservationTime").value,
    confirmation:
      document.getElementById("reservationConfirmation").value.trim(),
    cost:
      document.getElementById("reservationCost").value,
    note:
      document.getElementById("reservationNote").value.trim()
  };

  sortReservations(trip);
  saveTrips();

  openReservations(trip);
}


function deleteReservation(tripId, index) {
  const trip = trips.find(t => t.id === tripId);

  if (!confirm("Delete this reservation?")) return;

  trip.reservations.splice(index, 1);

  saveTrips();

  openReservations(trip);
}


function sortReservations(trip) {
  trip.reservations.sort((a, b) =>
    ((a.date || "") + (a.time || ""))
      .localeCompare(
        (b.date || "") + (b.time || "")
      )
  );
}


function saveTrips() {
  localStorage.setItem(
    "vacationTrips",
    JSON.stringify(trips)
  );
}
  function formatDate(date) {

  if (!date) return "";

  const parts = date.split("-");

  return `${parts[1]}/${parts[2]}/${parts[0]}`;
}
