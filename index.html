<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vacation Planner</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #f5f7fb;
  color: #1f2937;
}

header {
  background: #2563eb;
  color: white;
  padding: 30px 20px;
  border-radius: 0 0 24px 24px;
}

header h1 {
  margin: 0 0 6px;
  font-size: 30px;
}

header p {
  margin: 0;
  opacity: .9;
}

.container {
  max-width: 700px;
  margin: auto;
  padding: 20px;
}

.card {
  background: white;
  border-radius: 18px;
  padding: 20px;
  margin-bottom: 18px;
  box-shadow: 0 3px 12px rgba(0,0,0,.07);
}

h2 {
  margin-top: 0;
}

input {
  width: 100%;
  padding: 14px;
  margin: 7px 0 15px;
  border: 1px solid #d1d5db;
  border-radius: 12px;
  font-size: 16px;
}

button {
  border: 0;
  border-radius: 14px;
  padding: 14px 18px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
}

.primary {
  width: 100%;
  background: #2563eb;
  color: white;
}

.trip {
  border: 1px solid #e5e7eb;
  border-radius: 15px;
  padding: 16px;
  margin-bottom: 12px;
}

.trip-title {
  font-size: 21px;
  font-weight: 700;
}

.empty {
  color: #6b7280;
  text-align: center;
  padding: 15px;
}
</style>
</head>

<body>

<header>
  <h1>✈️ Vacation Planner</h1>
  <p>Plan your next adventure</p>
</header>

<div class="container">

  <div class="card">
    <h2>🌎 My Trips</h2>

    <div id="tripList">
      <div class="empty">
        No trips yet. Create your first vacation!
      </div>
    </div>

    <button class="primary" onclick="showNewTrip()">
      ➕ Create New Trip
    </button>
  </div>

  <div class="card" id="newTripCard" style="display:none;">

    <h2>🗺️ Create New Trip</h2>

    <label>Destination</label>
    <input id="destination" placeholder="Example: San Francisco">

    <label>Start date</label>
    <input id="startDate" type="date">

    <label>End date</label>
    <input id="endDate" type="date">

    <label>Number of travelers</label>
    <input id="travelers" type="number" min="1" value="4">

    <button class="primary" onclick="createTrip()">
      Create Trip
    </button>

  </div>

</div>

<script>

let trips =
  JSON.parse(localStorage.getItem("vacationTrips")) || [];

function showNewTrip() {
  document.getElementById("newTripCard").style.display = "block";
  document.getElementById("destination").focus();
}

function createTrip() {

  const destination =
    document.getElementById("destination").value.trim();

  const startDate =
    document.getElementById("startDate").value;

  const endDate =
    document.getElementById("endDate").value;

  const travelers =
    document.getElementById("travelers").value;

  if (!destination || !startDate || !endDate) {
    alert("Please enter your destination and dates.");
    return;
  }

  const trip = {
    id: Date.now(),
    destination: destination,
    startDate: startDate,
    endDate: endDate,
    travelers: travelers,
    activities: [],
    budget: 0
  };

  trips.push(trip);

  localStorage.setItem(
    "vacationTrips",
    JSON.stringify(trips)
  );

  document.getElementById("newTripCard").style.display = "none";

  displayTrips();
}

function displayTrips() {

  const list = document.getElementById("tripList");

  if (trips.length === 0) {
    list.innerHTML =
      '<div class="empty">No trips yet. Create your first vacation!</div>';
    return;
  }

  list.innerHTML = "";

  trips.forEach(trip => {

    const div = document.createElement("div");

    div.className = "trip";
    div.onclick = function() {
  openTrip(trip);
};

    div.innerHTML = `
      <div class="trip-title">
        🌴 ${trip.destination}
      </div>

      <p>
        📅 ${formatDate(trip.startDate)}
        – ${formatDate(trip.endDate)}
      </p>

      <p>
        👨‍👩‍👧‍👦 ${trip.travelers} traveler(s)
      </p>
    `;

    list.appendChild(div);

  });
}

function openTrip(trip) {
  document.body.innerHTML = `
    <header>
      <h1>✈️ ${trip.destination}</h1>
      <p>${formatDate(trip.startDate)} – ${formatDate(trip.endDate)}</p>
    </header>

    <div class="container">

      <div class="card">
        <h2>👨‍👩‍👧‍👦 Trip Details</h2>
        <p>${trip.travelers} travelers</p>
      </div>

      <div class="card">
        <h2>🗓️ Itinerary</h2>
        onclick="openItinerary(trips.find(t => t.id === ${trip.id}))"
          Add Itinerary
        </button>
      </div>

      <div class="card">
        <h2>📍 Places & Map</h2>
        onclick="openPlaces(trips.find(t => t.id === ${trip.id}))"
          Add Places
        </button>
      </div>

      <div class="card">
        <h2>🍽️ Restaurants</h2>
        onclick="openRestaurants(trips.find(t => t.id === ${trip.id}))"
          Add Restaurants
        </button>
      </div>

      <div class="card">
        <h2>🎟️ Activities</h2>
        onclick="openActivities(trips.find(t => t.id === ${trip.id}))"
          Add Activities
        </button>
      </div>
      
      <div class="card">
  <h2>🏨 Hotel</h2>
  onclick="openHotel(trips.find(t => t.id === ${trip.id}))"
    Hotel Details
  </button>
</div>

      <div class="card">
        <h2>💰 Budget</h2>
        onclick="openBudget(trips.find(t => t.id === ${trip.id}))"
          Add Expense
        </button>
      </div>

      <div class="card">
        <h2>🧳 Packing List</h2>
        onclick="openPackingList(trips.find(t => t.id === ${trip.id}))"
          Add Item
        </button>
      </div>

    </div>
  `;
}
function openItinerary(trip) {

  const activities = trip.activities || [];

  activities.sort((a, b) =>
    ((a.date || "") + (a.time || ""))
      .localeCompare((b.date || "") + (b.time || ""))
  );

  document.body.innerHTML = `
    <header>
      <button
        onclick="openTrip(trips.find(t => t.id === ${trip.id}))"
        style="background:rgba(255,255,255,.2); color:white; margin-bottom:15px;">
        ← Back
      </button>

      <h1>🗓️ ${trip.destination} Itinerary</h1>
      <p>${formatDate(trip.startDate)} – ${formatDate(trip.endDate)}</p>
    </header>

    <div class="container">

      <div class="card">
        <h2>📅 Day-by-Day Plans</h2>

        <div id="itineraryList">

          ${activities.length > 0
            ? activities.map((item, index) => `
              
              <div class="trip">

                <div class="trip-title">
                  ${prettyDate(item.date)}
                </div>

                <p>
                  🕐 ${prettyTime(item.time)}
                </p>

                <p>
                  ${item.plan}
                </p>

                <button
                  onclick="editItineraryItem(${trip.id}, ${index})">
                  ✏️ Edit
                </button>

                <button
                  onclick="deleteItineraryItem(${trip.id}, ${index})">
                  🗑️ Delete
                </button>

              </div>

            `).join("")
            : '<p class="empty">No plans added yet.</p>'
          }

        </div>

        <button
          class="primary"
          onclick="addItineraryItem(${trip.id})">
          ➕ Add a Plan
        </button>

      </div>

    </div>
  `;
}
function prettyDate(date) {
  if (!date) return "Date not set";

  const d = new Date(date + "T12:00:00");

  return d.toLocaleDateString("en-US", {
    weekday: "long",
    month: "short",
    day: "numeric"
  });
}

function prettyTime(time) {
  if (!time) return "No time set";

  const parts = time.split(":");
  let hour = Number(parts[0]);
  const minutes = parts[1];

  const ampm = hour >= 12 ? "PM" : "AM";

  hour = hour % 12;
  hour = hour || 12;

  return hour + ":" + minutes + " " + ampm;
}

function deleteItineraryItem(tripId, index) {
  const trip = trips.find(t => t.id === tripId);

  if (!confirm("Delete this plan?")) return;

  trip.activities.splice(index, 1);

  localStorage.setItem(
    "vacationTrips",
    JSON.stringify(trips)
  );

  openItinerary(trip);
}

function editItineraryItem(tripId, index) {
  const trip = trips.find(t => t.id === tripId);
  const item = trip.activities[index];

  document.body.innerHTML = `
    <header>
      <h1>✏️ Edit Plan</h1>
      <p>${trip.destination}</p>
    </header>

    <div class="container">
      <div class="card">

        <label>Date</label>
        <input
          id="editDate"
          type="date"
          min="${trip.startDate}"
          max="${trip.endDate}"
          value="${item.date || ""}"
        >

        <label>Time</label>
        <input
          id="editTime"
          type="time"
          value="${item.time || ""}"
        >

        <label>What are you doing?</label>
        <input
          id="editPlan"
          value="${item.plan || ""}"
        >

        <button
          class="primary"
          onclick="saveEditedItineraryItem(${trip.id}, ${index})">
          Save Changes
        </button>

      </div>
    </div>
  `;
}

function saveEditedItineraryItem(tripId, index) {
  const trip = trips.find(t => t.id === tripId);

  const date =
    document.getElementById("editDate").value;

  const time =
    document.getElementById("editTime").value;

  const plan =
    document.getElementById("editPlan").value.trim();

  if (!date || !time || !plan) {
    alert("Please choose a date, time, and activity.");
    return;
  }

  trip.activities[index] = {
    date: date,
    time: time,
    plan: plan
  };

  trip.activities.sort((a, b) =>
    (a.date + a.time).localeCompare(b.date + b.time)
  );

  localStorage.setItem(
    "vacationTrips",
    JSON.stringify(trips)
  );

  openItinerary(trip);
}
  function addItineraryItem(tripId) {
  const trip = trips.find(t => t.id === tripId);

  document.body.innerHTML = `
    <header>
      <h1>➕ Add a Plan</h1>
      <p>${trip.destination}</p>
    </header>

    <div class="container">
      <div class="card">

        <label>Date</label>
        <input
          id="planDate"
          type="date"
          min="${trip.startDate}"
          max="${trip.endDate}"
        >

        <label>Time</label>
        <input id="planTime" type="time">

        <label>What are you doing?</label>
        <input
          id="planName"
          placeholder="Example: Oakland Zoo"
        >

        <button class="primary"
          onclick="saveItineraryItem(${trip.id})">
          Save Plan
        </button>

      </div>
    </div>
  `;
}

function saveItineraryItem(tripId) {
  const trip = trips.find(t => t.id === tripId);

  const date = document.getElementById("planDate").value;
  const time = document.getElementById("planTime").value;
  const plan = document.getElementById("planName").value.trim();

  if (!date || !time || !plan) {
    alert("Please choose a date, time, and activity.");
    return;
  }

  trip.activities.push({
    date: date,
    time: time,
    plan: plan
  });

  trip.activities.sort((a, b) =>
    (a.date + a.time).localeCompare(b.date + b.time)
  );

  localStorage.setItem(
    "vacationTrips",
    JSON.stringify(trips)
  );

  openItinerary(trip);
}
function openPlaces(trip) {
  if (!trip.places) trip.places = [];

  document.body.innerHTML = `
    <header>
      <button
        onclick="openTrip(trips.find(t => t.id === ${trip.id}))"
        style="background:rgba(255,255,255,.2);color:white;margin-bottom:15px;">
        ← Back
      </button>

      <h1>📍 Places & Map</h1>
      <p>${trip.destination}</p>
    </header>

    <div class="container">

      <div class="card">
        <h2>Saved Places</h2>

        ${trip.places.length
          ? trip.places.map((place, index) => `
              <div class="trip">
                <div class="trip-title">${place.name}</div>
                <p>📍 ${place.address}</p>

                ${place.note
                  ? `<p>📝 ${place.note}</p>`
                  : ""
                }

                <button onclick="openPlaceInMaps('${encodeURIComponent(place.address)}')">
                  🗺️ Open in Maps
                </button>

                <button onclick="deletePlace(${trip.id}, ${index})">
                  🗑️ Delete
                </button>
              </div>
            `).join("")
          : '<p class="empty">No places saved yet.</p>'
        }

        <button
          class="primary"
          onclick="addPlace(${trip.id})">
          ➕ Add a Place
        </button>
      </div>

    </div>
  `;
}

function addPlace(tripId) {
  const trip = trips.find(t => t.id === tripId);

  document.body.innerHTML = `
    <header>
      <h1>📍 Add a Place</h1>
      <p>${trip.destination}</p>
    </header>

    <div class="container">
      <div class="card">

        <label>Place name</label>
        <input id="placeName"
          placeholder="Example: Oakland Zoo">

        <label>Address</label>
        <input id="placeAddress"
          placeholder="Example: 9777 Golf Links Rd, Oakland, CA">

        <label>Notes</label>
        <input id="placeNote"
          placeholder="Example: Arrive before 10 AM">

        <button
          class="primary"
          onclick="savePlace(${trip.id})">
          Save Place
        </button>

      </div>
    </div>
  `;
}

function savePlace(tripId) {
  const trip = trips.find(t => t.id === tripId);

  const name =
    document.getElementById("placeName").value.trim();

  const address =
    document.getElementById("placeAddress").value.trim();

  const note =
    document.getElementById("placeNote").value.trim();

  if (!name || !address) {
    alert("Please enter a place name and address.");
    return;
  }

  if (!trip.places) trip.places = [];

  trip.places.push({
    name: name,
    address: address,
    note: note
  });

  localStorage.setItem(
    "vacationTrips",
    JSON.stringify(trips)
  );

  openPlaces(trip);
}

function deletePlace(tripId, index) {
  const trip = trips.find(t => t.id === tripId);

  if (!confirm("Delete this place?")) return;

  trip.places.splice(index, 1);

  localStorage.setItem(
    "vacationTrips",
    JSON.stringify(trips)
  );

  openPlaces(trip);
}

function openPlaceInMaps(address) {
  window.open(
    "https://maps.apple.com/?q=" + address,
    "_blank"
  );
}
function openRestaurants(trip) {
  if (!trip.restaurants) trip.restaurants = [];

  document.body.innerHTML = `
    <header>
      <button
        onclick="openTrip(trips.find(t => t.id === ${trip.id}))"
        style="background:rgba(255,255,255,.2);color:white;margin-bottom:15px;">
        ← Back
      </button>

      <h1>🍽️ Restaurants</h1>
      <p>${trip.destination}</p>
    </header>

    <div class="container">
      <div class="card">
        <h2>Saved Restaurants</h2>

        ${trip.restaurants.length
          ? trip.restaurants.map((restaurant, index) => `
              <div class="trip">
                <div class="trip-title">
                  🍴 ${restaurant.name}
                </div>

                <p>📍 ${restaurant.address}</p>

                ${restaurant.date
                  ? `<p>📅 ${prettyDate(restaurant.date)}</p>`
                  : ""
                }

                ${restaurant.time
                  ? `<p>🕐 ${prettyTime(restaurant.time)}</p>`
                  : ""
                }

                ${restaurant.note
                  ? `<p>📝 ${restaurant.note}</p>`
                  : ""
                }

                <button
                  onclick="openPlaceInMaps('${encodeURIComponent(restaurant.address)}')">
                  🗺️ Open in Maps
                </button>

                <button
                  onclick="deleteRestaurant(${trip.id}, ${index})">
                  🗑️ Delete
                </button>
              </div>
            `).join("")
          : '<p class="empty">No restaurants saved yet.</p>'
        }

        <button
          class="primary"
          onclick="addRestaurant(${trip.id})">
          ➕ Add Restaurant
        </button>
      </div>
    </div>
  `;
}

function addRestaurant(tripId) {
  const trip = trips.find(t => t.id === tripId);

  document.body.innerHTML = `
    <header>
      <h1>🍽️ Add Restaurant</h1>
      <p>${trip.destination}</p>
    </header>

    <div class="container">
      <div class="card">

        <label>Restaurant name</label>
        <input id="restaurantName"
          placeholder="Example: Pier Market">

        <label>Address</label>
        <input id="restaurantAddress"
          placeholder="Restaurant address">

        <label>Reservation date</label>
        <input
          id="restaurantDate"
          type="date"
          min="${trip.startDate}"
          max="${trip.endDate}"
        >

        <label>Reservation time</label>
        <input id="restaurantTime" type="time">

        <label>Notes</label>
        <input id="restaurantNote"
          placeholder="Example: Dinner reservation">

        <button
          class="primary"
          onclick="saveRestaurant(${trip.id})">
          Save Restaurant
        </button>

      </div>
    </div>
  `;
}

function saveRestaurant(tripId) {
  const trip = trips.find(t => t.id === tripId);

  const name =
    document.getElementById("restaurantName").value.trim();

  const address =
    document.getElementById("restaurantAddress").value.trim();

  const date =
    document.getElementById("restaurantDate").value;

  const time =
    document.getElementById("restaurantTime").value;

  const note =
    document.getElementById("restaurantNote").value.trim();

  if (!name || !address) {
    alert("Please enter the restaurant name and address.");
    return;
  }

  if (!trip.restaurants) {
    trip.restaurants = [];
  }

  trip.restaurants.push({
    name: name,
    address: address,
    date: date,
    time: time,
    note: note
  });

  trip.restaurants.sort((a, b) =>
    ((a.date || "") + (a.time || ""))
      .localeCompare((b.date || "") + (b.time || ""))
  );

  localStorage.setItem(
    "vacationTrips",
    JSON.stringify(trips)
  );

  openRestaurants(trip);
}

function deleteRestaurant(tripId, index) {
  const trip = trips.find(t => t.id === tripId);

  if (!confirm("Delete this restaurant?")) return;

  trip.restaurants.splice(index, 1);

  localStorage.setItem(
    "vacationTrips",
    JSON.stringify(trips)
  );

  openRestaurants(trip);
}
function openActivities(trip) {
  if (!trip.tripActivities) trip.tripActivities = [];

  document.body.innerHTML = `
    <header>
      <button
        onclick="openTrip(trips.find(t => t.id === ${trip.id}))"
        style="background:rgba(255,255,255,.2);color:white;margin-bottom:15px;">
        ← Back
      </button>

      <h1>🎟️ Activities</h1>
      <p>${trip.destination}</p>
    </header>

    <div class="container">
      <div class="card">
        <h2>My Activities</h2>

        ${trip.tripActivities.length
          ? trip.tripActivities.map((activity, index) => `
              <div class="trip">
                <div class="trip-title">
                  🎟️ ${activity.name}
                </div>

                ${activity.date
                  ? `<p>📅 ${prettyDate(activity.date)}</p>`
                  : ""
                }

                ${activity.time
                  ? `<p>🕐 ${prettyTime(activity.time)}</p>`
                  : ""
                }

                ${activity.address
                  ? `<p>📍 ${activity.address}</p>`
                  : ""
                }

                ${activity.cost
                  ? `<p>💵 $${activity.cost}</p>`
                  : ""
                }

                ${activity.confirmation
                  ? `<p>🎫 Confirmation: ${activity.confirmation}</p>`
                  : ""
                }

                ${activity.note
                  ? `<p>📝 ${activity.note}</p>`
                  : ""
                }

                ${activity.address
                  ? `<button
                       onclick="openPlaceInMaps('${encodeURIComponent(activity.address)}')">
                       🗺️ Open in Maps
                     </button>`
                  : ""
                }

                <button
                  onclick="deleteActivity(${trip.id}, ${index})">
                  🗑️ Delete
                </button>
              </div>
            `).join("")
          : '<p class="empty">No activities saved yet.</p>'
        }

        <button
          class="primary"
          onclick="addActivity(${trip.id})">
          ➕ Add Activity
        </button>
      </div>
    </div>
  `;
}

function addActivity(tripId) {
  const trip = trips.find(t => t.id === tripId);

  document.body.innerHTML = `
    <header>
      <h1>🎟️ Add Activity</h1>
      <p>${trip.destination}</p>
    </header>

    <div class="container">
      <div class="card">

        <label>Activity name</label>
        <input id="activityName"
          placeholder="Example: Oakland Zoo">

        <label>Date</label>
        <input
          id="activityDate"
          type="date"
          min="${trip.startDate}"
          max="${trip.endDate}"
        >

        <label>Time</label>
        <input id="activityTime" type="time">

        <label>Address</label>
        <input id="activityAddress"
          placeholder="Optional">

        <label>Cost</label>
        <input
          id="activityCost"
          type="number"
          min="0"
          step="0.01"
          placeholder="Example: 45.00"
        >

        <label>Ticket / confirmation number</label>
        <input id="activityConfirmation"
          placeholder="Optional">

        <label>Notes</label>
        <input id="activityNote"
          placeholder="Optional">

        <button
          class="primary"
          onclick="saveActivity(${trip.id})">
          Save Activity
        </button>

      </div>
    </div>
  `;
}

function saveActivity(tripId) {
  const trip = trips.find(t => t.id === tripId);

  const name =
    document.getElementById("activityName").value.trim();

  const date =
    document.getElementById("activityDate").value;

  const time =
    document.getElementById("activityTime").value;

  const address =
    document.getElementById("activityAddress").value.trim();

  const cost =
    document.getElementById("activityCost").value;

  const confirmation =
    document.getElementById("activityConfirmation").value.trim();

  const note =
    document.getElementById("activityNote").value.trim();

  if (!name) {
    alert("Please enter an activity name.");
    return;
  }

  if (!trip.tripActivities) {
    trip.tripActivities = [];
  }

  trip.tripActivities.push({
    name: name,
    date: date,
    time: time,
    address: address,
    cost: cost,
    confirmation: confirmation,
    note: note
  });

  trip.tripActivities.sort((a, b) =>
    ((a.date || "") + (a.time || ""))
      .localeCompare((b.date || "") + (b.time || ""))
  );

  localStorage.setItem(
    "vacationTrips",
    JSON.stringify(trips)
  );

  openActivities(trip);
}

function deleteActivity(tripId, index) {
  const trip = trips.find(t => t.id === tripId);

  if (!confirm("Delete this activity?")) return;

  trip.tripActivities.splice(index, 1);

  localStorage.setItem(
    "vacationTrips",
    JSON.stringify(trips)
  );

  openActivities(trip);
}
function openBudget(trip) {
  if (!trip.expenses) trip.expenses = [];
  if (!trip.budget) trip.budget = 0;

  const activityTotal = (trip.tripActivities || [])
    .reduce((total, activity) =>
      total + (parseFloat(activity.cost) || 0), 0);

  const expenseTotal = trip.expenses
    .reduce((total, expense) =>
      total + (parseFloat(expense.amount) || 0), 0);

  const hotelTotal =
  parseFloat(trip.hotel?.cost) || 0;

const spent =
  activityTotal + expenseTotal + hotelTotal;
  const remaining = trip.budget - spent;

  document.body.innerHTML = `
    <header>
      <button
        onclick="openTrip(trips.find(t => t.id === ${trip.id}))"
        style="background:rgba(255,255,255,.2);color:white;margin-bottom:15px;">
        ← Back
      </button>

      <h1>💰 Trip Budget</h1>
      <p>${trip.destination}</p>
    </header>

    <div class="container">

      <div class="card">
        <h2>Budget Summary</h2>

        <p><strong>💵 Budget:</strong>
          $${Number(trip.budget).toFixed(2)}
        </p>

        <p><strong>💳 Spent:</strong>
          $${spent.toFixed(2)}
        </p>

        <p><strong>💰 Remaining:</strong>
          $${remaining.toFixed(2)}
        </p>

        <button
          class="primary"
          onclick="setTripBudget(${trip.id})">
          Set Trip Budget
        </button>
      </div>

      <div class="card">
        <h2>Expenses</h2>

        ${trip.expenses.length
          ? trip.expenses.map((expense, index) => `
              <div class="trip">
                <div class="trip-title">
                  ${expense.category}
                </div>

                <p>${expense.description}</p>

                <p>
                  💵 $${Number(expense.amount).toFixed(2)}
                </p>

                <button
                  onclick="deleteExpense(${trip.id}, ${index})">
                  🗑️ Delete
                </button>
              </div>
            `).join("")
          : '<p class="empty">No extra expenses yet.</p>'
        }

        <button
          class="primary"
          onclick="addExpense(${trip.id})">
          ➕ Add Expense
        </button>
      </div>

      <div class="card">
        <h2>🎟️ Activity Costs</h2>
        ${hotelTotal > 0 ? `
  <div class="card">
    <h2>🏨 Hotel Cost</h2>
    <div class="trip">
      <strong>${trip.hotel.name}</strong>
      <p>💵 $${hotelTotal.toFixed(2)}</p>
    </div>
  </div>
` : ""}

        ${(trip.tripActivities || [])
          .filter(activity => parseFloat(activity.cost))
          .map(activity => `
            <div class="trip">
              <strong>${activity.name}</strong>
              <p>💵 $${Number(activity.cost).toFixed(2)}</p>
            </div>
          `).join("")
          || '<p class="empty">No activity costs yet.</p>'
        }
      </div>

    </div>
  `;
}

function setTripBudget(tripId) {
  const trip = trips.find(t => t.id === tripId);

  const amount = prompt(
    "What is your total trip budget?",
    trip.budget || ""
  );

  if (amount === null) return;

  const number = parseFloat(amount);

  if (isNaN(number) || number < 0) {
    alert("Please enter a valid amount.");
    return;
  }

  trip.budget = number;

  localStorage.setItem(
    "vacationTrips",
    JSON.stringify(trips)
  );

  openBudget(trip);
}

function addExpense(tripId) {
  const trip = trips.find(t => t.id === tripId);

  document.body.innerHTML = `
    <header>
      <h1>💳 Add Expense</h1>
      <p>${trip.destination}</p>
    </header>

    <div class="container">
      <div class="card">

        <label>Category</label>
        <select id="expenseCategory"
          style="width:100%;padding:14px;margin:7px 0 15px;border:1px solid #d1d5db;border-radius:12px;font-size:16px;">
          <option>🏨 Hotel</option>
          <option>🍽️ Food</option>
          <option>🚗 Transportation</option>
          <option>🎟️ Tickets</option>
          <option>🛍️ Shopping</option>
          <option>⛽ Gas</option>
          <option>💵 Other</option>
        </select>

        <label>Description</label>
        <input
          id="expenseDescription"
          placeholder="Example: Hyatt hotel"
        >

        <label>Amount</label>
        <input
          id="expenseAmount"
          type="number"
          min="0"
          step="0.01"
          placeholder="0.00"
        >

        <button
          class="primary"
          onclick="saveExpense(${trip.id})">
          Save Expense
        </button>

      </div>
    </div>
  `;
}

function saveExpense(tripId) {
  const trip = trips.find(t => t.id === tripId);

  const category =
    document.getElementById("expenseCategory").value;

  const description =
    document.getElementById("expenseDescription").value.trim();

  const amount =
    parseFloat(document.getElementById("expenseAmount").value);

  if (!description || isNaN(amount) || amount < 0) {
    alert("Please enter a description and valid amount.");
    return;
  }

  if (!trip.expenses) trip.expenses = [];

  trip.expenses.push({
    category: category,
    description: description,
    amount: amount
  });

  localStorage.setItem(
    "vacationTrips",
    JSON.stringify(trips)
  );

  openBudget(trip);
}

function deleteExpense(tripId, index) {
  const trip = trips.find(t => t.id === tripId);

  if (!confirm("Delete this expense?")) return;

  trip.expenses.splice(index, 1);

  localStorage.setItem(
    "vacationTrips",
    JSON.stringify(trips)
  );

  openBudget(trip);
}
function openHotel(trip) {
  const hotel = trip.hotel || {};

  document.body.innerHTML = `
    <header>
      <button
        onclick="openTrip(trips.find(t => t.id === ${trip.id}))"
        style="background:rgba(255,255,255,.2);color:white;margin-bottom:15px;">
        ← Back
      </button>

      <h1>🏨 Hotel</h1>
      <p>${trip.destination}</p>
    </header>

    <div class="container">

      ${hotel.name ? `
        <div class="card">
          <h2>${hotel.name}</h2>

          <p>📍 ${hotel.address || "No address"}</p>

          <p>
            📅 Check-in:
            ${hotel.checkIn ? prettyDate(hotel.checkIn) : "Not set"}
            ${hotel.checkInTime ? " • " + prettyTime(hotel.checkInTime) : ""}
          </p>

          <p>
            📅 Check-out:
            ${hotel.checkOut ? prettyDate(hotel.checkOut) : "Not set"}
            ${hotel.checkOutTime ? " • " + prettyTime(hotel.checkOutTime) : ""}
          </p>

          ${hotel.confirmation
            ? `<p>🔑 Confirmation: ${hotel.confirmation}</p>`
            : ""
          }

          ${hotel.cost
            ? `<p>💵 Hotel total: $${Number(hotel.cost).toFixed(2)}</p>`
            : ""
          }

          ${hotel.note
            ? `<p>📝 ${hotel.note}</p>`
            : ""
          }

          ${hotel.address ? `
            <button
              onclick="openPlaceInMaps('${encodeURIComponent(hotel.address)}')">
              🗺️ Open in Maps
            </button>
          ` : ""}

          <button
            class="primary"
            onclick="editHotel(${trip.id})">
            ✏️ Edit Hotel
          </button>
        </div>
      ` : `
        <div class="card">
          <p class="empty">No hotel added yet.</p>

          <button
            class="primary"
            onclick="editHotel(${trip.id})">
            ➕ Add Hotel
          </button>
        </div>
      `}

    </div>
  `;
}

function editHotel(tripId) {
  const trip = trips.find(t => t.id === tripId);
  const hotel = trip.hotel || {};

  document.body.innerHTML = `
    <header>
      <h1>🏨 Hotel Details</h1>
      <p>${trip.destination}</p>
    </header>

    <div class="container">
      <div class="card">

        <label>Hotel name</label>
        <input
          id="hotelName"
          value="${hotel.name || ""}"
          placeholder="Example: Hyatt Place"
        >

        <label>Address</label>
        <input
          id="hotelAddress"
          value="${hotel.address || ""}"
          placeholder="Hotel address"
        >

        <label>Check-in date</label>
        <input
          id="hotelCheckIn"
          type="date"
          value="${hotel.checkIn || trip.startDate}"
        >

        <label>Check-in time</label>
        <input
          id="hotelCheckInTime"
          type="time"
          value="${hotel.checkInTime || ""}"
        >

        <label>Check-out date</label>
        <input
          id="hotelCheckOut"
          type="date"
          value="${hotel.checkOut || trip.endDate}"
        >

        <label>Check-out time</label>
        <input
          id="hotelCheckOutTime"
          type="time"
          value="${hotel.checkOutTime || ""}"
        >

        <label>Confirmation number</label>
        <input
          id="hotelConfirmation"
          value="${hotel.confirmation || ""}"
          placeholder="Optional"
        >

        <label>Total hotel cost</label>
        <input
          id="hotelCost"
          type="number"
          min="0"
          step="0.01"
          value="${hotel.cost || ""}"
          placeholder="0.00"
        >

        <label>Notes</label>
        <input
          id="hotelNote"
          value="${hotel.note || ""}"
          placeholder="Parking, breakfast, room info, etc."
        >

        <button
          class="primary"
          onclick="saveHotel(${trip.id})">
          Save Hotel
        </button>

      </div>
    </div>
  `;
}

function saveHotel(tripId) {
  const trip = trips.find(t => t.id === tripId);

  const name =
    document.getElementById("hotelName").value.trim();

  if (!name) {
    alert("Please enter the hotel name.");
    return;
  }

  trip.hotel = {
    name: name,
    address:
      document.getElementById("hotelAddress").value.trim(),

    checkIn:
      document.getElementById("hotelCheckIn").value,

    checkInTime:
      document.getElementById("hotelCheckInTime").value,

    checkOut:
      document.getElementById("hotelCheckOut").value,

    checkOutTime:
      document.getElementById("hotelCheckOutTime").value,

    confirmation:
      document.getElementById("hotelConfirmation").value.trim(),

    cost:
      document.getElementById("hotelCost").value,

    note:
      document.getElementById("hotelNote").value.trim()
  };

  localStorage.setItem(
    "vacationTrips",
    JSON.stringify(trips)
  );

  openHotel(trip);
}
function openPackingList(trip) {
  if (!trip.packingList) trip.packingList = [];

  const packedCount =
    trip.packingList.filter(item => item.packed).length;

  const totalCount = trip.packingList.length;

  const categories = [
    "👕 Clothes",
    "🧴 Toiletries",
    "🧸 Kids",
    "🔌 Electronics",
    "📄 Documents",
    "🎒 Other"
  ];

  document.body.innerHTML = `
    <header>
      <button
        onclick="openTrip(trips.find(t => t.id === ${trip.id}))"
        style="background:rgba(255,255,255,.2);color:white;margin-bottom:15px;">
        ← Back
      </button>

      <h1>🧳 Packing List</h1>
      <p>${trip.destination}</p>
    </header>

    <div class="container">

      <div class="card">
        <h2>📦 Packing Progress</h2>

        <p>
          <strong>${packedCount} of ${totalCount}</strong>
          items packed
        </p>

        ${totalCount > 0 ? `
          <progress
            value="${packedCount}"
            max="${totalCount}"
            style="width:100%;height:25px;">
          </progress>
        ` : ""}
      </div>

      <div class="card">
        <h2>My Packing List</h2>

        ${totalCount
          ? categories.map(category => {

              const items =
                trip.packingList
                  .map((item, index) => ({
                    ...item,
                    originalIndex: index
                  }))
                  .filter(item =>
                    item.category === category
                  );

              if (!items.length) return "";

              return `
                <h3>${category}</h3>

                ${items.map(item => `
                  <div class="trip">

                    <div
                      onclick="togglePacked(${trip.id}, ${item.originalIndex})"
                      style="cursor:pointer;">

                      <div class="trip-title"
                        style="${item.packed
                          ? "text-decoration:line-through;opacity:.55;"
                          : ""
                        }">

                        ${item.packed ? "✅" : "⬜️"}
                        ${item.name}

                      </div>
                    </div>

                    <button
                      onclick="deletePackingItem(${trip.id}, ${item.originalIndex})">
                      🗑️ Delete
                    </button>

                  </div>
                `).join("")}
              `;

            }).join("")
          : '<p class="empty">Your packing list is empty.</p>'
        }

        <button
          class="primary"
          onclick="addPackingItem(${trip.id})">
          ➕ Add Item
        </button>
      </div>

    </div>
  `;
}


function addPackingItem(tripId) {
  const trip = trips.find(t => t.id === tripId);

  document.body.innerHTML = `
    <header>
      <h1>➕ Add Packing Item</h1>
      <p>${trip.destination}</p>
    </header>

    <div class="container">
      <div class="card">

        <label>What do you need to pack?</label>

        <input
          id="packingItemName"
          placeholder="Example: Swimsuits"
        >

        <label>Category</label>

        <select
          id="packingCategory"
          style="
            width:100%;
            padding:14px;
            margin:7px 0 15px;
            border:1px solid #d1d5db;
            border-radius:12px;
            font-size:16px;
          ">

          <option>👕 Clothes</option>
          <option>🧴 Toiletries</option>
          <option>🧸 Kids</option>
          <option>🔌 Electronics</option>
          <option>📄 Documents</option>
          <option>🎒 Other</option>

        </select>

        <button
          class="primary"
          onclick="savePackingItem(${trip.id})">
          Add to Packing List
        </button>

      </div>
    </div>
  `;
}


function savePackingItem(tripId) {
  const trip = trips.find(t => t.id === tripId);

  const name =
    document.getElementById("packingItemName")
      .value.trim();

  const category =
    document.getElementById("packingCategory")
      .value;

  if (!name) {
    alert("Please enter an item.");
    return;
  }

  if (!trip.packingList) {
    trip.packingList = [];
  }

  trip.packingList.push({
    name: name,
    category: category,
    packed: false
  });

  localStorage.setItem(
    "vacationTrips",
    JSON.stringify(trips)
  );

  openPackingList(trip);
}


function togglePacked(tripId, index) {
  const trip = trips.find(t => t.id === tripId);

  trip.packingList[index].packed =
    !trip.packingList[index].packed;

  localStorage.setItem(
    "vacationTrips",
    JSON.stringify(trips)
  );

  openPackingList(trip);
}


function deletePackingItem(tripId, index) {
  const trip = trips.find(t => t.id === tripId);

  if (!confirm("Delete this packing item?")) {
    return;
  }

  trip.packingList.splice(index, 1);

  localStorage.setItem(
    "vacationTrips",
    JSON.stringify(trips)
  );

  openPackingList(trip);
}
  function formatDate(date) {

  if (!date) return "";

  const parts = date.split("-");

  return `${parts[1]}/${parts[2]}/${parts[0]}`;
}

displayTrips();

</script>
